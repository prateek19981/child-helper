services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: koober
      POSTGRES_PASSWORD: koober
      POSTGRES_DB: koober
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koober -d koober"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
